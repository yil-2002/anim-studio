name: Render animation

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan fayli (scenes/ ichida)"
        default: "scenes/demo.json"
        required: true
      samples:
        description: "Cycles samples (10 = tez, 32 = final sifat)"
        default: "12"
        required: true
      quality:
        description: "Sahna zichligi (1.0 = to'liq, 0.4 = tez)"
        default: "1.0"
        required: true
      res:
        description: "O'lcham: 720x1280 (final) yoki 540x960 (tez)"
        default: "720x1280"
        required: true
      preview:
        description: "1 = faqat bitta kadr (vaqt o'lchash uchun)"
        default: "0"
        required: true
      chunk:
        description: "Bir jobdagi kadrlar soni (kichikroq = ko'proq parallel)"
        default: "28"
        required: true
      denoise:
        description: "1 = OIDN denoise, 0 = o'chirilgan"
        default: "1"
        required: true

env:
  BLENDER_VER: "4.3.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      nslots: ${{ steps.read.outputs.nslots }}
      fps: ${{ steps.read.outputs.fps }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          PLAN: ${{ github.event.inputs.plan || 'scenes/demo.json' }}
          CHUNK: ${{ github.event.inputs.chunk || '28' }}
        run: python3 src/plan_info.py >> $GITHUB_OUTPUT

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Blender keshi
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VER }}-linux-x64-v1

      - name: Blender o'rnatish
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          sudo timedatectl set-ntp false 2>/dev/null || true
          timeout 240 sudo apt-get update -qq || true
          timeout 240 sudo apt-get install -y -qq --no-install-recommends \
            curl xz-utils libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libegl1 libsm6 libice6 libglib2.0-0 || echo "apt qisman o'tdi"
          curl -fsSL "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VER}-linux-x64.tar.xz" -o /tmp/b.tar.xz
          mkdir -p ~/blender
          tar -xf /tmp/b.tar.xz -C ~/blender --strip-components=1
          ~/blender/blender --version | head -1

      - name: Tizim kutubxonalari (EGL/GL)
        run: |
          if ! ldconfig -p | grep -q libEGL.so.1; then
            echo "libEGL yo'q — o'rnatilmoqda"
            timeout 300 sudo apt-get install -y -qq --no-install-recommends \
              libegl1 libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 \
              libsm6 libice6 libx11-6 libglib2.0-0 || echo "apt xato (davom etamiz)"
          fi
          ldconfig -p | grep -c "libEGL" || true
          ffmpeg -version | head -1 || echo "ffmpeg yo'q"
          ~/blender/blender --version | head -1

      - name: Render (shot ${{ matrix.task.shot }} kadr ${{ matrix.task.fs }}-${{ matrix.task.fe }})
        run: |
          PLAN="${{ github.event.inputs.plan || 'scenes/demo.json' }}"
          mkdir -p frames
          EXTRA=""
          if [ "${{ github.event.inputs.preview }}" = "1" ]; then EXTRA="--preview 1"; fi
          if [ "${{ github.event.inputs.denoise }}" != "0" ]; then EXTRA="$EXTRA --denoise"; fi
          echo "START $(date +%T)"
          time ~/blender/blender -b -P blender/build_scene.py -- \
            --plan "$PLAN" --shot ${{ matrix.task.shot }} --outdir frames \
            --frame-start ${{ matrix.task.fs }} --frame-end ${{ matrix.task.fe }} \
            --samples ${{ github.event.inputs.samples || 48 }} \
            --quality ${{ github.event.inputs.quality || 1.0 }} \
            --res ${{ github.event.inputs.res || '720x1280' }} \
            $EXTRA 2>&1 | tail -100
          echo "BLENDER_EXIT=${PIPESTATUS[0]}"
          echo "END $(date +%T)"
          if [ "${{ github.event.inputs.preview }}" = "1" ]; then
            echo "PREVIEW rejimi: 1 kadr"
             cp frames/preview_*.png frames/f_0001.png || true
             rm -f frames/preview_*.png
          fi
          echo "--- kadrlar soni: $(ls frames/*.png 2>/dev/null | wc -l)"

      - name: MP4 ga kodlash
        run: |
          FPS=${{ needs.plan.outputs.fps }}
          if ! ls frames/*.png >/dev/null 2>&1; then echo "KADR YO'Q!"; exit 1; fi
          ffmpeg -y -v error -framerate $FPS -start_number ${{ matrix.task.fs }} \
            -i frames/f_%04d.png -c:v libx264 -preset medium -crf 16 \
            -pix_fmt yuv420p seg_${{ matrix.task.idx }}.mp4
          ls -lh seg_${{ matrix.task.idx }}.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.task.idx }}
          path: seg_${{ matrix.task.idx }}.mp4
          retention-days: 3

  compose:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          merge-multiple: true

      - name: Kutubxonalar
        run: |
          timeout 180 sudo apt-get update -qq || true
          (ffmpeg -version >/dev/null && echo "ffmpeg bor") || timeout 240 sudo apt-get install -y -qq ffmpeg
          timeout 120 sudo apt-get install -y -qq fonts-dejavu-core || true

      - name: Montaj
        run: |
          PLAN="${{ github.event.inputs.plan || 'scenes/demo.json' }}"
          WM="${{ secrets.WATERMARK }}"
          CHUNK="${{ github.event.inputs.chunk || '28' }}"
          python3 src/compose.py --plan "$PLAN" --out final.mp4 \
            --segments . --chunk "$CHUNK" --audio narration.m4a --watermark "$WM"
          ls -lh final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
          retention-days: 7

      - name: Telegram'ga yuborish
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "TG token yo'q — o'tkazib yuborildi"; exit 0; fi
          curl -s -F chat_id="$TG_CHAT" \
               -F video=@final.mp4 \
               -F caption="Video tayyor: ${{ github.event.inputs.plan }}" \
               -F supports_streaming=true \
               "https://api.telegram.org/bot$TG_TOKEN/sendVideo" | head -c 300
